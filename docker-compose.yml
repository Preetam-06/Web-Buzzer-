services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trivia_backend
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - REDIS_URL=redis://127.0.0.1:6379/0
      - DATA_DIR=/app/data
      - HOST_LAN_IP=${HOST_LAN_IP:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-}
    volumes:
      - ./data:/app/data
      - redis_data:/app/redis-data
    restart: unless-stopped

volumes:
  redis_data:
